name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:4.0.10
    steps:
      - uses: actions/checkout@v7

      - name: Build liblouis
        run: scripts/build-liblouis.sh

      - name: Test
        run: node --test tests/*.test.mjs

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: braille
          path: dist/braille.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: braille

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" braille.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
